<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>مولد نصائح السوشيال ميديا</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .container {
    max-width: 1100px;
    margin: auto;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 20px; font-size: 28px; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

  .controls { display: flex; flex-direction: column; gap: 12px; }
  .controls label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 5px; }
  .controls input, .controls textarea, .controls select {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.9);
    color: #333;
    font-size: 15px;
    width: 100%;
  }
  .controls textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .slider-group {
    background: rgba(255,255,255,0.15);
    padding: 12px;
    border-radius: 10px;
  }
  .slider-group label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .slider-group input[type="range"] {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.3);
    outline: none;
    -webkit-appearance: none;
  }
  .slider-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  .btn {
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-download { background: #FF9800; color: #fff; width: 100%; margin-bottom: 8px; }
  .btn-share { background: #4CAF50; color: #fff; width: 100%; }
  .btn:hover { transform: translateY(-2px); opacity: 0.9; }

  .preview {
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    max-width: 100%;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    cursor: grab;
    touch-action: none;
  }
  canvas:active { cursor: grabbing; }
  .hint { font-size: 12px; opacity: 0.8; text-align: center; margin-top: 8px; }
  .section-title {
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid rgba(255,255,255,0.3);
  }
  .drag-hint {
    background: rgba(255,255,0,0.2);
    border: 1px solid rgba(255,255,0,0.5);
    padding: 8px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    margin-top: 5px;
  }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.15);
    padding: 10px;
    border-radius: 10px;
  }
  .checkbox-group input[type="checkbox"] {
    width: 22px;
    height: 22px;
    cursor: pointer;
  }
  .checkbox-group label {
    margin: 0;
    cursor: pointer;
    flex: 1;
  }
  .watermark-options {
    background: rgba(255,255,255,0.1);
    padding: 12px;
    border-radius: 10px;
    display: none;
  }
  .watermark-options.active { display: block; }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    color: #333;
  }
  .modal-content img {
    max-width: 100%;
    border-radius: 10px;
    margin: 15px 0;
  }
  .modal-content .btn {
    margin: 5px;
    width: auto;
    display: inline-block;
    padding: 10px 20px;
  }
  .modal-close {
    background: #f44336;
    color: #fff;
  }
  .modal-instruction {
    background: #fff3cd;
    border: 1px solid #ffc107;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    margin: 10px 0;
    color: #856404;
  }
</style>
</head>
<body>
<div class="container">
  <h1>✨ مولد نصائح السوشيال ميديا</h1>
  <div class="layout">
    <!-- لوحة التحكم -->
    <div class="controls">
      <label>1) اختر صورة من جهازك:</label>
      <input type="file" id="imgInput" accept="image/*">

      <label>2) اكتب النصيحة:</label>
      <textarea id="adviceText" placeholder="اكتب نصيحتك هنا..."></textarea>

      <div class="section-title">🎨 إعدادات النص</div>
      <div class="row">
        <div>
          <label>حجم الخط:</label>
          <input type="number" id="fontSize" value="42" min="10" max="120">
        </div>
        <div>
          <label>لون النص:</label>
          <input type="color" id="textColor" value="#ffffff">
        </div>
      </div>

      <div class="row">
        <div>
          <label>محاذاة النص:</label>
          <select id="textAlign">
            <option value="right">يمين</option>
            <option value="center" selected>وسط</option>
            <option value="left">يسار</option>
          </select>
        </div>
        <div>
          <label>نمط الخلفية:</label>
          <select id="bgStyle">
            <option value="shadow">ظل خلف النص</option>
            <option value="box">مربع ملون</option>
            <option value="none">بدون</option>
          </select>
        </div>
      </div>

      <div class="section-title">📅 التاريخ (أسفل الصورة)</div>
      <div class="checkbox-group">
        <input type="checkbox" id="showDate" checked>
        <label for="showDate">إظهار التاريخ الميلادي والهجري</label>
      </div>
      <div class="row">
        <div>
          <label>لون التاريخ:</label>
          <input type="color" id="dateColor" value="#ffffff">
        </div>
        <div>
          <label>حجم خط التاريخ:</label>
          <input type="number" id="dateFontSize" value="28" min="14" max="50">
        </div>
      </div>

      <div class="section-title">💧 العلامة المائية</div>
      <div class="checkbox-group">
        <input type="checkbox" id="showWatermark">
        <label for="showWatermark">إضافة علامة مائية</label>
      </div>
      <div class="watermark-options" id="watermarkOptions">
        <div class="row">
          <div>
            <label>نص العلامة المائية:</label>
            <input type="text" id="watermarkText" placeholder="مثال: @qarna68" value="@qarna68">
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div>
            <label>لون العلامة:</label>
            <input type="color" id="watermarkColor" value="#ffffff">
          </div>
          <div>
            <label>حجم الخط:</label>
            <input type="number" id="watermarkSize" value="24" min="12" max="50">
          </div>
        </div>
        <div style="margin-top:10px;">
          <label>موضع العلامة:</label>
          <select id="watermarkPos">
            <option value="bottom-right">أسفل يمين</option>
            <option value="bottom-left">أسفل يسار</option>
            <option value="top-right">أعلى يمين</option>
            <option value="top-left">أعلى يسار</option>
          </select>
        </div>
      </div>

      <div class="section-title">📍 تحريك النص</div>
      <div class="drag-hint">👆 اسحب النص مباشرة على الصورة لتحريكه</div>
      
      <div class="slider-group">
        <label>
          <span>الموضع الأفقي (X)</span>
          <span id="posXValue">540</span>
        </label>
        <input type="range" id="posX" min="0" max="1080" value="540">
      </div>

      <div class="slider-group">
        <label>
          <span>الموضع العمودي (Y)</span>
          <span id="posYValue">450</span>
        </label>
        <input type="range" id="posY" min="0" max="1080" value="450">
      </div>

      <div class="slider-group">
        <label>
          <span>عرض النص (Max Width)</span>
          <span id="maxWidthValue">900</span>
        </label>
        <input type="range" id="maxWidth" min="200" max="1000" value="900">
      </div>

      <button class="btn btn-download" onclick="downloadImage()">⬇️ تحميل الصورة</button>
      <button class="btn btn-share" onclick="shareImage()">📤 مشاركة / حفظ في الاستوديو</button>
      <p class="hint">💡 زر "مشاركة" يحفظ مباشرة في استوديو الآيفون</p>
    </div>

    <!-- المعاينة -->
    <div class="preview">
      <canvas id="canvas" width="1080" height="1080"></canvas>
      <p class="hint">معاينة مباشرة (1080×1080)</p>
    </div>
  </div>
</div>

<!-- Modal للتحميل -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3> حفظ الصورة على الآيفون</h3>
    <img id="modalImg" src="" alt="preview">
    <div class="modal-instruction">
      <strong>طريقة الحفظ:</strong><br>
      اضغط مطولاً على الصورة → اختر "حفظ في الصور"
    </div>
    <button class="btn" onclick="openInNewTab()"> فتح في نافذة جديدة</button>
    <button class="btn modal-close" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let userImage = null;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

// ====== حساب التاريخ ======
function getDates() {
  const now = new Date();
  
  // التاريخ الميلادي بالعربية
  const gregorian = new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  }).format(now);
  
  // التاريخ الهجري
  const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  }).format(now);
  
  return { gregorian: gregorian + ' م', hijri: hijri + 'هـ' };
}

// ====== رسم الخلفية الافتراضية ======
function drawDefault() {
  const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
  grad.addColorStop(0, '#667eea');
  grad.addColorStop(1, '#764ba2');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1080);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 40px Tahoma';
  ctx.textAlign = 'center';
  ctx.fillText('👈 ارفع صورة واكتب نصيحتك', 540, 540);
}
drawDefault();

// ====== عند رفع صورة ======
document.getElementById('imgInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      userImage = img;
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ====== إظهار/إخفاء خيارات العلامة المائية ======
document.getElementById('showWatermark').addEventListener('change', (e) => {
  document.getElementById('watermarkOptions').classList.toggle('active', e.target.checked);
  render();
});

// ====== تحديث فوري ======
['adviceText', 'fontSize', 'textColor', 'textAlign', 'bgStyle', 'posX', 'posY', 'maxWidth',
 'showDate', 'dateColor', 'dateFontSize', 'watermarkText', 'watermarkColor', 'watermarkSize', 'watermarkPos']
.forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', (e) => {
    if (id === 'posX') document.getElementById('posXValue').textContent = e.target.value;
    if (id === 'posY') document.getElementById('posYValue').textContent = e.target.value;
    if (id === 'maxWidth') document.getElementById('maxWidthValue').textContent = e.target.value;
    render();
  });
  el.addEventListener('change', render);
});

// ====== رسم النص مع التفاف الأسطر ======
function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// ====== رسم شريط سفلي للتاريخ ======
function drawDateBar() {
  if (!document.getElementById('showDate').checked) return;
  
  const dates = getDates();
  const fontSize = parseInt(document.getElementById('dateFontSize').value);
  const color = document.getElementById('dateColor').value;
  
  // شريط خلفية نصف شفاف
  const barHeight = fontSize * 3.5;
  const gradient = ctx.createLinearGradient(0, 1080 - barHeight, 0, 1080);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(0.3, 'rgba(0,0,0,0.6)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 1080 - barHeight, 1080, barHeight);
  
  // خط فاصل
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(100, 1080 - barHeight + 20);
  ctx.lineTo(980, 1080 - barHeight + 20);
  ctx.stroke();
  
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  ctx.font = `bold ${fontSize}px Tahoma, Arial`;
  
  const y1 = 1080 - barHeight + 60;
  const y2 = 1080 - barHeight + 60 + fontSize * 1.5;
  
  ctx.fillText(dates.gregorian, 540, y1);
  ctx.font = `${fontSize - 4}px Tahoma, Arial`;
  ctx.fillText(dates.hijri, 540, y2);
}

// ====== رسم العلامة المائية ======
function drawWatermark() {
  if (!document.getElementById('showWatermark').checked) return;
  
  const text = document.getElementById('watermarkText').value.trim();
  if (!text) return;
  
  const fontSize = parseInt(document.getElementById('watermarkSize').value);
  const color = document.getElementById('watermarkColor').value;
  const pos = document.getElementById('watermarkPos').value;
  
  ctx.font = `bold ${fontSize}px Tahoma, Arial`;
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.7;
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  
  const padding = 40;
  let x, y;
  
  switch(pos) {
    case 'bottom-right': x = 1080 - padding; y = 1080 - padding; break;
    case 'bottom-left': x = padding; y = 1080 - padding; break;
    case 'top-right': x = 1080 - padding; y = padding + fontSize; break;
    case 'top-left': x = padding; y = padding + fontSize; break;
  }
  
  // محاذاة حسب الموضع
  if (pos.includes('right')) ctx.textAlign = 'right';
  else if (pos.includes('left')) ctx.textAlign = 'left';
  else ctx.textAlign = 'center';
  
  // ظل للعلامة المائية
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;
  ctx.fillText(text, x, y);
  ctx.shadowColor = 'transparent';
  ctx.globalAlpha = 1;
}

// ====== الرسم الرئيسي ======
function render() {
  ctx.clearRect(0, 0, 1080, 1080);

  if (userImage) {
    const r = Math.max(1080 / userImage.width, 1080 / userImage.height);
    const w = userImage.width * r;
    const h = userImage.height * r;
    ctx.drawImage(userImage, (1080 - w) / 2, (1080 - h) / 2, w, h);
  } else {
    drawDefault();
  }

  const text = document.getElementById('adviceText').value.trim();
  if (!text || !userImage) {
    drawDateBar();
    drawWatermark();
    return;
  }

  const fontSize = parseInt(document.getElementById('fontSize').value);
  const color = document.getElementById('textColor').value;
  const align = document.getElementById('textAlign').value;
  const bg = document.getElementById('bgStyle').value;
  const posX = parseInt(document.getElementById('posX').value);
  const posY = parseInt(document.getElementById('posY').value);
  const maxWidth = parseInt(document.getElementById('maxWidth').value);

  ctx.font = `bold ${fontSize}px Tahoma, Arial`;
  ctx.textAlign = align;
  ctx.direction = 'rtl';

  const lines = wrapText(text, maxWidth);
  const lineHeight = fontSize * 1.4;
  const totalHeight = lines.length * lineHeight;

  const padding = 30;
  let maxLineWidth = 0;
  lines.forEach(l => {
    const w = ctx.measureText(l).width;
    if (w > maxLineWidth) maxLineWidth = w;
  });

  let boxX, boxY, boxW, boxH;
  if (align === 'center') boxX = posX - maxLineWidth / 2 - padding;
  else if (align === 'right') boxX = posX - maxLineWidth - padding;
  else boxX = posX - padding;
  boxY = posY - totalHeight / 2 - padding / 2;
  boxW = maxLineWidth + padding * 2;
  boxH = totalHeight + padding;

  if (bg === 'box') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(boxX, boxY, boxW, boxH);
  }

  ctx.fillStyle = color;
  if (bg === 'shadow') {
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
  }

  const startY = posY - totalHeight / 2 + lineHeight;
  lines.forEach((line, i) => {
    ctx.fillText(line, posX, startY + i * lineHeight);
  });
  ctx.shadowColor = 'transparent';

  if (isDragging) {
    ctx.strokeStyle = 'rgba(255,255,0,0.8)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 5]);
    ctx.strokeRect(boxX, boxY, boxW, boxH);
    ctx.setLineDash([]);
  }

  // رسم التاريخ والعلامة المائية في النهاية (فوق كل شيء)
  drawDateBar();
  drawWatermark();
}

// ====== تحويل الإحداثيات ======
function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

// ====== أحداث الماوس ======
canvas.addEventListener('mousedown', (e) => {
  const coords = getCanvasCoords(e.clientX, e.clientY);
  const text = document.getElementById('adviceText').value.trim();
  if (!text || !userImage) return;
  
  const posX = parseInt(document.getElementById('posX').value);
  const posY = parseInt(document.getElementById('posY').value);
  const fontSize = parseInt(document.getElementById('fontSize').value);
  const maxWidth = parseInt(document.getElementById('maxWidth').value);
  const align = document.getElementById('textAlign').value;
  
  ctx.font = `bold ${fontSize}px Tahoma, Arial`;
  const lines = wrapText(text, maxWidth);
  const lineHeight = fontSize * 1.4;
  const totalHeight = lines.length * lineHeight;
  
  let maxLineWidth = 0;
  lines.forEach(l => {
    const w = ctx.measureText(l).width;
    if (w > maxLineWidth) maxLineWidth = w;
  });
  
  let boxX;
  if (align === 'center') boxX = posX - maxLineWidth / 2 - 30;
  else if (align === 'right') boxX = posX - maxLineWidth - 30;
  else boxX = posX - 30;
  const boxY = posY - totalHeight / 2 - 15;
  const boxW = maxLineWidth + 60;
  const boxH = totalHeight + 30;
  
  if (coords.x >= boxX && coords.x <= boxX + boxW && 
      coords.y >= boxY && coords.y <= boxY + boxH) {
    isDragging = true;
    dragStartX = coords.x - posX;
    dragStartY = coords.y - posY;
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const coords = getCanvasCoords(e.clientX, e.clientY);
  let newX = coords.x - dragStartX;
  let newY = coords.y - dragStartY;
  newX = Math.max(0, Math.min(1080, newX));
  newY = Math.max(0, Math.min(1080, newY));
  document.getElementById('posX').value = newX;
  document.getElementById('posY').value = newY;
  document.getElementById('posXValue').textContent = Math.round(newX);
  document.getElementById('posYValue').textContent = Math.round(newY);
  render();
});

canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; render(); });
canvas.addEventListener('mouseleave', () => { isDragging = false; canvas.style.cursor = 'grab'; render(); });

// ====== أحداث اللمس (الآيفون) ======
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const coords = getCanvasCoords(touch.clientX, touch.clientY);
  const text = document.getElementById('adviceText').value.trim();
  if (!text || !userImage) return;
  
  const posX = parseInt(document.getElementById('posX').value);
  const posY = parseInt(document.getElementById('posY').value);
  const fontSize = parseInt(document.getElementById('fontSize').value);
  const maxWidth = parseInt(document.getElementById('maxWidth').value);
  const align = document.getElementById('textAlign').value;
  
  ctx.font = `bold ${fontSize}px Tahoma, Arial`;
  const lines = wrapText(text, maxWidth);
  const lineHeight = fontSize * 1.4;
  const totalHeight = lines.length * lineHeight;
  
  let maxLineWidth = 0;
  lines.forEach(l => {
    const w = ctx.measureText(l).width;
    if (w > maxLineWidth) maxLineWidth = w;
  });
  
  let boxX;
  if (align === 'center') boxX = posX - maxLineWidth / 2 - 30;
  else if (align === 'right') boxX = posX - maxLineWidth - 30;
  else boxX = posX - 30;
  const boxY = posY - totalHeight / 2 - 15;
  const boxW = maxLineWidth + 60;
  const boxH = totalHeight + 30;
  
  if (coords.x >= boxX && coords.x <= boxX + boxW && 
      coords.y >= boxY && coords.y <= boxY + boxH) {
    isDragging = true;
    dragStartX = coords.x - posX;
    dragStartY = coords.y - posY;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!isDragging) return;
  const touch = e.touches[0];
  const coords = getCanvasCoords(touch.clientX, touch.clientY);
  let newX = coords.x - dragStartX;
  let newY = coords.y - dragStartY;
  newX = Math.max(0, Math.min(1080, newX));
  newY = Math.max(0, Math.min(1080, newY));
  document.getElementById('posX').value = newX;
  document.getElementById('posY').value = newY;
  document.getElementById('posXValue').textContent = Math.round(newX);
  document.getElementById('posYValue').textContent = Math.round(newY);
  render();
}, { passive: false });

canvas.addEventListener('touchend', (e) => { e.preventDefault(); isDragging = false; render(); }, { passive: false });

// ====== التحميل (مع Modal للآيفون) ======
function downloadImage() {
  // إعادة الرسم بدون إطار السحب
  isDragging = false;
  render();
  
  const dataURL = canvas.toDataURL('image/png');
  
  // للآيفون: اعرض في Modal
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    document.getElementById('modalImg').src = dataURL;
    document.getElementById('modal').classList.add('active');
  } else {
    // للكمبيوتر: تحميل مباشر
    const link = document.createElement('a');
    link.download = 'advice_' + Date.now() + '.png';
    link.href = dataURL;
    link.click();
  }
}

function openInNewTab() {
  const dataURL = canvas.toDataURL('image/png');
  const win = window.open();
  win.document.write('<img src="' + dataURL + '" style="max-width:100%">');
  win.document.title = 'نصيحة اليوم';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// ====== المشاركة المباشرة (يحفظ في الاستوديو) ======
async function shareImage() {
  isDragging = false;
  render();
  
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'advice.png', { type: 'image/png' });
    
    // Web Share API - يعمل على الآيفون ويحفظ مباشرة في الاستوديو
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'نصيحة اليوم',
          text: document.getElementById('adviceText').value.trim()
        });
      } catch (err) {
        console.log('مشاركة ملغاة');
      }
    } else {
      // Fallback: عرض في Modal
      document.getElementById('modalImg').src = canvas.toDataURL('image/png');
      document.getElementById('modal').classList.add('active');
    }
  }, 'image/png');
}

// إغلاق Modal عند النقر خارج المحتوى
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});
</script>
