<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مولد نصائح السوشيال ميديا</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .container {
    max-width: 1100px;
    margin: auto;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 20px; font-size: 28px; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

  .controls { display: flex; flex-direction: column; gap: 12px; }
  .controls label { font-size: 14px; font-weight: bold; }
  .controls input, .controls textarea, .controls select {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.9);
    color: #333;
    font-size: 15px;
  }
  .controls textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .btn {
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-upload { background: #4CAF50; color: #fff; }
  .btn-download { background: #FF9800; color: #fff; }
  .btn:hover { transform: translateY(-2px); opacity: 0.9; }

  .preview {
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    max-width: 100%;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .hint { font-size: 12px; opacity: 0.8; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>✨ مولد نصائح السوشيال ميديا</h1>
  <div class="layout">
    <!-- لوحة التحكم -->
    <div class="controls">
      <label>1) اختر صورة من جهازك:</label>
      <input type="file" id="imgInput" accept="image/*">

      <label>2) اكتب النصيحة:</label>
      <textarea id="adviceText" placeholder="اكتب نصيحتك هنا..."></textarea>

      <div class="row">
        <div>
          <label>حجم الخط:</label>
          <input type="number" id="fontSize" value="42" min="10" max="120">
        </div>
        <div>
          <label>لون النص:</label>
          <input type="color" id="textColor" value="#ffffff">
        </div>
      </div>

      <div class="row">
        <div>
          <label>موضع النص:</label>
          <select id="position">
            <option value="top">أعلى</option>
            <option value="center" selected>وسط</option>
            <option value="bottom">أسفل</option>
          </select>
        </div>
        <div>
          <label>نمط الخلفية:</label>
          <select id="bgStyle">
            <option value="shadow">ظل خلف النص</option>
            <option value="box">مربع ملون</option>
            <option value="none">بدون</option>
          </select>
        </div>
      </div>

      <button class="btn btn-download" onclick="downloadImage()">⬇️ تحميل الصورة</button>
      <p class="hint">💡 انشر الصورة على إنستغرام وتويتر مباشرة</p>
    </div>

    <!-- المعاينة -->
    <div class="preview">
      <canvas id="canvas" width="1080" height="1080"></canvas>
      <p class="hint">معاينة مباشرة (1080×1080 - مقاس إنستغرام المثالي)</p>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let userImage = null;

// رسم الخلفية الافتراضية
function drawDefault() {
  const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
  grad.addColorStop(0, '#667eea');
  grad.addColorStop(1, '#764ba2');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1080);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 40px Tahoma';
  ctx.textAlign = 'center';
  ctx.fillText('👈 ارفع صورة واكتب نصيحتك', 540, 540);
}
drawDefault();

// عند رفع صورة
document.getElementById('imgInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      userImage = img;
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// تحديث فوري عند تغيير أي حقل
['adviceText', 'fontSize', 'textColor', 'position', 'bgStyle'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

// رسم النص مع التفاف الأسطر (wrap) للعربية
function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// الرسم الرئيسي
function render() {
  ctx.clearRect(0, 0, 1080, 1080);

  // رسم الصورة مع الحفاظ على النسبة (cover)
  if (userImage) {
    const r = Math.max(1080 / userImage.width, 1080 / userImage.height);
    const w = userImage.width * r;
    const h = userImage.height * r;
    ctx.drawImage(userImage, (1080 - w) / 2, (1080 - h) / 2, w, h);
  } else {
    drawDefault();
  }

  const text = document.getElementById('adviceText').value.trim();
  if (!text || !userImage) return;

  const fontSize = parseInt(document.getElementById('fontSize').value);
  const color = document.getElementById('textColor').value;
  const pos = document.getElementById('position').value;
  const bg = document.getElementById('bgStyle').value;

  ctx.font = `bold ${fontSize}px Tahoma, Arial`;
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';

  const lines = wrapText(text, 900);
  const lineHeight = fontSize * 1.4;
  const totalHeight = lines.length * lineHeight;

  // تحديد Y حسب الموضع
  let startY;
  if (pos === 'top') startY = 150;
  else if (pos === 'bottom') startY = 1080 - 150 - totalHeight + lineHeight;
  else startY = (1080 - totalHeight) / 2 + lineHeight;

  // حساب حدود المربع
  const padding = 30;
  let maxLineWidth = 0;
  lines.forEach(l => {
    const w = ctx.measureText(l).width;
    if (w > maxLineWidth) maxLineWidth = w;
  });
  const boxX = (1080 - maxLineWidth) / 2 - padding;
  const boxY = startY - lineHeight + 10 - padding / 2;
  const boxW = maxLineWidth + padding * 2;
  const boxH = totalHeight + padding;

  // رسم الخلفية
  if (bg === 'box') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(boxX, boxY, boxW, boxH);
  }

  // رسم النص
  ctx.fillStyle = color;
  if (bg === 'shadow') {
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
  }
  lines.forEach((line, i) => {
    ctx.fillText(line, 540, startY + i * lineHeight);
  });
  ctx.shadowColor = 'transparent';
}

// تحميل الصورة
function downloadImage() {
  const link = document.createElement('a');
  link.download = 'advice_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
