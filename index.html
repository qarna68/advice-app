<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مولد قصص السناب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@700&family=Tajawal:wght@700&family=Lalezar&family=Reem+Kufi:wght@700&family=Changa:wght@700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Tajawal,Tahoma,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#fff;padding:16px}
  .wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:20px;padding:20px}
  @media(max-width:800px){.wrap{grid-template-columns:1fr}}
  .panel{display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto;padding-inline-end:6px}
  h3{font-size:15px;border-bottom:2px solid rgba(255,255,255,.3);padding-bottom:4px;margin-top:8px}
  label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
  input,select,textarea{width:100%;padding:9px;border:none;border-radius:10px;background:rgba(255,255,255,.92);color:#333;font-size:15px;font-family:inherit}
  input[type=range]{padding:0;height:6px;margin-top:6px}
  input[type=color]{height:38px;padding:3px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
  .chk input{width:20px;height:20px}
  .btn{padding:12px;border:none;border-radius:10px;font:700 16px Tajawal,sans-serif;color:#fff;cursor:pointer;width:100%}
  .btn-rs{background:rgba(255,255,255,.2)}
  .btn-sh{background:#4CAF50}
  .stage{display:flex;flex-direction:column;align-items:center;gap:8px}
  #cv{height:82vh;width:auto;max-width:100%;aspect-ratio:9/16;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.45);touch-action:none;cursor:grab}
  @media(max-width:800px){#cv{height:auto;width:100%}}
  .hint{font-size:12px;opacity:.85;text-align:center}
  .status{font-size:13px;color:#ffe082;min-height:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3>📎 الوسائط</h3>
    <label>اختر صورة أو فيديو (اختياري)</label>
    <input type="file" id="file" accept="image/*,video/*">

    <h3>✍️ النص</h3>
    <textarea data-k="text.v" rows="3" placeholder="اكتب نصيحتك هنا..."></textarea>
    <div class="row">
      <div><label>الخط</label><select class="fonts" data-k="text.font"></select></div>
      <div><label>الحجم</label><input type="number" data-k="text.size" min="20" max="200"></div>
    </div>
    <div class="row">
      <div><label>اللون</label><input type="color" data-k="text.color"></div>
      <div><label>المحاذاة</label>
        <select data-k="text.align">
          <option value="right">يمين</option><option value="center">وسط</option><option value="left">يسار</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>الخلفية</label>
        <select data-k="text.style">
          <option value="shadow">ظل</option><option value="box">مربع</option><option value="glow">توهج</option><option value="none">بدون</option>
        </select>
      </div>
      <div><label>الشفافية</label><input type="range" min="0" max="1" step="0.05" data-k="text.op"></div>
    </div>
    <label>عرض النص</label>
    <input type="range" min="300" max="1000" step="10" data-k="text.maxW">

    <h3>📅 التاريخ</h3>
    <label class="chk"><input type="checkbox" data-k="date.show"> إظهار التاريخ الميلادي والهجري</label>
    <div class="row">
      <div><label>الخط</label><select class="fonts" data-k="date.font"></select></div>
      <div><label>الحجم</label><input type="number" data-k="date.size" min="14" max="120"></div>
    </div>
    <div class="row">
      <div><label>اللون</label><input type="color" data-k="date.color"></div>
      <div><label>الشفافية</label><input type="range" min="0" max="1" step="0.05" data-k="date.op"></div>
    </div>

    <h3>💧 التوقيع</h3>
    <label class="chk"><input type="checkbox" data-k="sig.show"> إظهار التوقيع</label>
    <input type="text" data-k="sig.v" placeholder="مثال: @username">
    <div class="row">
      <div><label>الخط</label><select class="fonts" data-k="sig.font"></select></div>
      <div><label>الحجم</label><input type="number" data-k="sig.size" min="14" max="120"></div>
    </div>
    <div class="row">
      <div><label>اللون</label><input type="color" data-k="sig.color"></div>
      <div><label>الشفافية</label><input type="range" min="0" max="1" step="0.05" data-k="sig.op"></div>
    </div>

    <h3>🎬 التأثيرات</h3>
    <label>فلتر الخلفية</label>
    <select data-k="S.effect">
      <option value="none">بدون</option>
      <option value="blur">ضبابية</option>
      <option value="gray">أبيض وأسود</option>
      <option value="sepia">ريترو</option>
      <option value="warm">دافئ</option>
      <option value="vignette">إطار داكن</option>
    </select>
    <label>تعتيم الخلفية</label>
    <input type="range" min="0" max="0.8" step="0.05" data-k="S.dark">
    <button class="btn btn-rs" id="reset">↺ إعادة المواضع الافتراضية</button>

    <h3>📤 التصدير</h3>
    <button class="btn btn-sh" id="exp">📤 مشاركة / حفظ</button>
    <div class="status" id="status"></div>
    <p class="hint">اسحب النص أو التاريخ أو التوقيع مباشرة على المعاينة</p>
  </div>

  <div class="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <p class="hint">معاينة 1080×1920 (ستوري)</p>
  </div>
</div>

<script>
const W = 1080, H = 1920;
const FONTS = ['Amiri','Cairo','Tajawal','Lalezar','Reem Kufi','Changa','Aref Ruqaa'];
const FILT = { blur:'blur(14px)', gray:'grayscale(1)', sepia:'sepia(.9) contrast(1.05)', warm:'saturate(1.35) sepia(.25)' };
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

const S = {
  effect:'none', dark:0, media:null, mtype:null, drag:null,
  text:{ v:'', font:'Amiri', size:80, color:'#ffffff', align:'center', style:'shadow', maxW:880, x:540, y:960, op:1 },
  date:{ show:true, font:'Cairo', size:42, color:'#ffffff', align:'center', style:'shadow', x:540, y:1640, op:.9 },
  sig:{ show:true, v:'@qarna68', font:'Cairo', size:40, color:'#ffffff', align:'center', style:'shadow', x:540, y:1740, op:.85 }
};
const DEF = { text:{x:540,y:960}, date:{x:540,y:1640}, sig:{x:540,y:1740} };

const fontStr = (f, s) => `700 ${s}px "${f}", Tahoma, sans-serif`;
let B = {}, pend = false, looping = false, exporting = false;

function wrap(text, f, s, maxW) {
  ctx.font = fontStr(f, s);
  const out = [];
  text.split('\n').forEach(p => {
    let line = '';
    p.split(' ').forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; }
      else line = t;
    });
    out.push(line);
  });
  return out;
}

function measure(lines, f, s) {
  ctx.font = fontStr(f, s);
  const w = Math.max(0, ...lines.map(l => ctx.measureText(l).width));
  return { w, h: lines.length * s * 1.45, lh: s * 1.45 };
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

function paint(el, lines) {
  const m = measure(lines, el.font, el.size), P = 28;
  const L = el.x - m.w / 2 - P, T = el.y - m.h / 2 - P * .6, bw = m.w + P * 2, bh = m.h + P * 1.2;
  ctx.save();
  ctx.globalAlpha = el.op;
  ctx.font = fontStr(el.font, el.size);
  ctx.fillStyle = el.color;
  ctx.textAlign = el.align;
  ctx.textBaseline = 'middle';
  if (el.style === 'box') { ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(L, T, bw, bh, 22); ctx.fill(); ctx.fillStyle = el.color; }
  if (el.style === 'shadow') { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4; }
  if (el.style === 'glow') { ctx.shadowColor = el.color; ctx.shadowBlur = 36; }
  const x = el.align === 'right' ? el.x + m.w / 2 : el.align === 'left' ? el.x - m.w / 2 : el.x;
  lines.forEach((ln, i) => ctx.fillText(ln, x, el.y - m.h / 2 + m.lh * (i + .5)));
  ctx.restore();
  return { x: L, y: T, w: bw, h: bh };
}

function dateLines() {
  const n = new Date();
  const g = new Intl.DateTimeFormat('ar-SA-u-ca-gregory', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(n);
  const h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', { day:'numeric', month:'long', year:'numeric' }).format(n);
  return [g + ' م', h + ' هـ'];
}

function drawBg() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#667eea'); g.addColorStop(1, '#764ba2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const m = S.media;
  const ready = m && (S.mtype === 'image' || m.readyState >= 2);
  if (ready) {
    const sw = m.videoWidth || m.naturalWidth, sh = m.videoHeight || m.naturalHeight;
    const r = Math.max(W / sw, H / sh), dw = sw * r, dh = sh * r;
    ctx.filter = FILT[S.effect] || 'none';
    ctx.drawImage(m, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.filter = 'none';
  }
  if (S.dark > 0) { ctx.fillStyle = `rgba(0,0,0,${S.dark})`; ctx.fillRect(0, 0, W, H); }
  if (S.effect === 'vignette') {
    const v = ctx.createRadialGradient(W/2, H/2, H*.25, W/2, H/2, H*.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.8)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
}

function draw() {
  drawBg();
  B = {};
  if (S.text.v.trim()) B.text = paint(S.text, wrap(S.text.v, S.text.font, S.text.size, S.text.maxW));
  if (S.date.show) B.date = paint(S.date, dateLines());
  if (S.sig.show && S.sig.v.trim()) B.sig = paint(S.sig, [S.sig.v]);
  if (S.drag && B[S.drag.n]) {
    const b = B[S.drag.n];
    ctx.save(); ctx.setLineDash([14, 8]); ctx.lineWidth = 4; ctx.strokeStyle = '#FFD700';
    ctx.strokeRect(b.x, b.y, b.w, b.h); ctx.restore();
  }
}

function schedule() {
  if (pend) return;
  pend = true;
  requestAnimationFrame(() => { pend = false; draw(); });
}

function loop() {
  draw();
  if (S.mtype === 'video') requestAnimationFrame(loop); else looping = false;
}
function startLoop() { if (!looping) { looping = true; loop(); } }

function loadFont(f) { return document.fonts.load(fontStr(f, 40)).then(schedule).catch(() => {}); }

// ===== الوسائط =====
$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  if (S.mtype === 'video' && S.media) { S.media.pause(); S.media.removeAttribute('src'); S.media.load(); }
  if (f.type.startsWith('video')) {
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
    v.onloadeddata = () => { S.media = v; S.mtype = 'video'; v.play().catch(() => {}); startLoop(); };
    v.src = url; v.load();
  } else {
    const img = new Image();
    img.onload = () => { S.media = img; S.mtype = 'image'; schedule(); };
    img.src = url;
  }
};

// ===== ربط عناصر التحكم =====
function getVal(o, k) { return (o === 'S' ? S : S[o])[k]; }
document.querySelectorAll('.fonts').forEach(s => {
  s.innerHTML = FONTS.map(f => `<option value="${f}">${f}</option>`).join('');
});
document.querySelectorAll('[data-k]').forEach(el => {
  const [o, k] = el.dataset.k.split('.');
  const v = getVal(o, k);
  if (el.type === 'checkbox') el.checked = v; else el.value = v;
  const handler = () => {
    const val = el.type === 'checkbox' ? el.checked
      : (el.type === 'number' || el.type === 'range') ? (+el.value || 0) : el.value;
    (o === 'S' ? S : S[o])[k] = val;
    if (k === 'font') loadFont(val);
    schedule();
  };
  el.addEventListener('input', handler);
  el.addEventListener('change', handler);
});

$('reset').onclick = () => {
  Object.assign(S.text, DEF.text); Object.assign(S.date, DEF.date); Object.assign(S.sig, DEF.sig);
  schedule();
};

// ===== السحب باليد (ماوس + لمس) =====
const pt = e => {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
};
cv.onpointerdown = e => {
  const p = pt(e);
  for (const n of ['sig', 'date', 'text']) {
    const b = B[n];
    if (b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      S.drag = { n, dx: p.x - S[n].x, dy: p.y - S[n].y };
      cv.setPointerCapture(e.pointerId);
      schedule();
      return;
    }
  }
};
cv.onpointermove = e => {
  if (!S.drag) return;
  const p = pt(e), el = S[S.drag.n];
  el.x = Math.min(W, Math.max(0, p.x - S.drag.dx));
  el.y = Math.min(H, Math.max(0, p.y - S.drag.dy));
  schedule();
};
const endDrag = () => { if (S.drag) { S.drag = null; schedule(); } };
cv.onpointerup = endDrag;
cv.onpointercancel = endDrag;

// ===== التصدير =====
const st = t => { $('status').textContent = t; };

async function save(blob, ext) {
  const file = new File([blob], `story_${Date.now()}.${ext}`, { type: blob.type || 'application/octet-stream' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}

function recordVideo() {
  const v = S.media;
  if (!window.MediaRecorder || !cv.captureStream) {
    st('المتصفح لا يدعم تسجيل الفيديو، تم حفظ الإطار الحالي');
    draw(); cv.toBlob(b => save(b, 'png'), 'image/png');
    return;
  }
  exporting = true;
  st('جاري تسجيل الفيديو...');
  const stream = cv.captureStream(30);
  try {
    const a = v.captureStream ? v.captureStream() : null;
    if (a) a.getAudioTracks().forEach(t => stream.addTrack(t));
  } catch (e) {}
  const type = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: type });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    v.loop = true; v.onended = null; exporting = false;
    st('');
    await save(new Blob(chunks, { type }), type.includes('mp4') ? 'mp4' : 'webm');
  };
  v.loop = false; v.currentTime = 0;
  v.onended = () => { if (rec.state !== 'inactive') rec.stop(); };
  setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, (isFinite(v.duration) ? v.duration : 15) * 1000 + 500);
  rec.start(200);
  v.play().catch(() => {});
}

$('exp').onclick = () => {
  if (exporting) return;
  if (S.mtype === 'video') { recordVideo(); return; }
  draw();
  cv.toBlob(b => save(b, 'png'), 'image/png');
};

// ===== التشغيل =====
Promise.all(FONTS.map(f => document.fonts.load(fontStr(f, 40)))).then(schedule).catch(() => {});
schedule();
</script>
</body>
</html>
